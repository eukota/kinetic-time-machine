<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Time Machine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics: injected at build time when VITE_UMAMI_WEBSITE_ID is set -->
    <script type="module">
      const id = import.meta.env.VITE_UMAMI_WEBSITE_ID
      if (id) {
        const s = document.createElement('script')
        s.defer = true
        s.src = 'https://analytics.eukota.com/script.js'
        s.dataset.websiteId = id
        document.head.appendChild(s)
      }
    </script>
  </body>
</html>
