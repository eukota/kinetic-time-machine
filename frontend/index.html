<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetic Time Machine — Race-Day Photo Tracker</title>
    <meta name="theme-color" content="#1B263B" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics: injected at build time when VITE_UMAMI_WEBSITE_ID is set -->
    <script type="module">
      const id = import.meta.env.VITE_UMAMI_WEBSITE_ID
      if (id) {
        const s = document.createElement('script')
        s.defer = true
        s.src = 'https://analytics.eukota.com/script.js'
        s.dataset.websiteId = id
        document.head.appendChild(s)
      }
    </script>
  </body>
</html>
