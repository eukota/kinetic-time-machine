# Staging stack — separate from prod, but shares the prod Caddy via the
# external "ktm-proxy" Docker network (declared in docker-compose.prod.yml).
#
# Services are named with a "staging-" prefix so Docker DNS on the shared
# proxy network does NOT collide with prod's `backend` / `frontend` (which
# would cause Caddy to round-robin between stacks).
#
# Lives in a separate server checkout (e.g. /opt/kinetic-time-machine-staging)
# so its ./data is independent of prod.

services:
  staging-backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/data       # <- staging's data, isolated from prod's checkout
    env_file:
      - .env
    environment:
      PHOTOS_DIR: /data/photos
      DATABASE_URL: sqlite:////data/kgc_race.db
    expose:
      - "8000"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks:
      - proxy
      - default

  staging-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Set VITE_UMAMI_WEBSITE_ID in staging's .env to the *staging* site UUID
        # in Umami (kept separate from the prod site so analytics don't mingle).
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - staging-backend
    networks:
      - proxy
      - default

networks:
  proxy:
    external: true
    name: ktm-proxy
  default:
