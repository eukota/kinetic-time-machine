# Staging stack — separate from prod, but shares the prod Caddy via the
# external "ktm-proxy" Docker network (declared in docker-compose.prod.yml).
#
# Lives in a separate server checkout (e.g. /opt/kinetic-time-machine-staging)
# so its ./data is independent of prod. Caddy reaches these services as
# "staging-backend" / "staging-frontend" via network aliases.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/data       # <- this is staging's data, isolated from prod's checkout
    env_file:
      - .env
    environment:
      PHOTOS_DIR: /data/photos
      DATABASE_URL: sqlite:////data/kgc_race.db
    expose:
      - "8000"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks:
      proxy:
        aliases: [staging-backend]
      default:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      # No Umami tracking on staging (would skew prod analytics)
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      proxy:
        aliases: [staging-frontend]
      default:

networks:
  proxy:
    external: true
    name: ktm-proxy
  default:
