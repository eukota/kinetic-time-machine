<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kinetic Time Machine — quarter-sheet flyers</title>
<style>
  /* ----- US Letter, 4 true quarter-sheets (4.25" × 5.5") per page ----- */
  @page { size: letter; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    width: 8.5in;
    height: 11in;
    display: grid;
    grid-template-columns: 4.25in 4.25in;
    grid-template-rows: 5.5in 5.5in;
    page-break-after: always;
  }

  .card {
    width: 4.25in;
    height: 5.5in;
    padding: 0.45in 0.4in;
    border: 1px dashed #cbd5e1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #0f172a;
  }

  .eyebrow {
    font-size: 9pt;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #64748b;
    font-weight: 600;
    margin-bottom: 0.08in;
  }
  .title {
    font-size: 28pt;
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -0.015em;
    margin: 0 0 0.16in;
  }
  .cta {
    font-size: 14pt;
    font-weight: 600;
    line-height: 1.25;
    color: #1e293b;
    margin: 0 0 0.25in;
    max-width: 3.2in;
  }
  .qr {
    width: 2.3in;
    height: 2.3in;
    object-fit: contain;
    display: block;
    margin-bottom: 0.18in;
  }
  .url {
    font-size: 13pt;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #1e40af;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  @media print { .card { border-color: #e5e7eb; } }
</style>
</head>
<body>

<script>
  const card = `
    <div class="card">
      <div class="eyebrow">Kinetic Grand Championship</div>
      <h1 class="title">Kinetic Time Machine</h1>
      <p class="cta">Snap photos. See them on the map.</p>
      <img class="qr" src="qr.jpg" alt="QR code to kinetic.eukota.com" />
      <div class="url">kinetic.eukota.com</div>
    </div>
  `;
  document.write('<div class="sheet">' + card.repeat(4) + '</div>');
</script>

</body>
</html>
