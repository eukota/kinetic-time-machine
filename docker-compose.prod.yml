services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      PHOTOS_DIR: /data/photos
      DATABASE_URL: sqlite:////data/kgc_race.db
    expose:
      - "8000"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    networks:
      proxy:
        aliases: [backend]
      default:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      proxy:
        aliases: [frontend]
      default:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - umami
    networks:
      - proxy

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db:/var/lib/postgresql/data
    expose:
      - "5432"
    # umami-db only needs to talk to umami; keep it on the default network
    # (no need to expose it on the shared proxy network)

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.13.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    expose:
      - "3000"
    depends_on:
      - umami-db
    networks:
      proxy:
        aliases: [umami]
      default:

networks:
  proxy:
    external: true
    name: ktm-proxy
  default:

volumes:
  caddy_data:
  caddy_config:
  umami_db:
